# Draws the contribution snake in the portfolio's palette, one SVG per
# theme, and publishes them to the `output` branch the README reads.
name: Snake

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1E768F&color_dots=#E5E9F0,#B7D6E0,#88C0D0,#4F9BB1,#1E768F
            dist/snake-dark.svg?color_snake=#88C0D0&color_dots=#161B22,#23414B,#35687A,#5E9FB2,#88C0D0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
