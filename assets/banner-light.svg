  <text x="66" y="236" class="mono" font-size="24" fill="#1E768F">&#8250;</text>
  <text x="96" y="236" clip-path="url(#t0)" textLength="460.8" lengthAdjust="spacingAndGlyphs" class="mono" font-size="24" fill="#485265">I ship AI systems to production.</text>
  <text x="96" y="236" clip-path="url(#t1)" textLength="504.0" lengthAdjust="spacingAndGlyphs" class="mono" font-size="24" fill="#485265">I measure them before I trust them.</text>
  <text x="96" y="236" clip-path="url(#t2)" textLength="532.8" lengthAdjust="spacingAndGlyphs" class="mono" font-size="24" fill="#485265">I design so the mistake can&#8217;t happen.</text>
  <text x="96" y="236" clip-path="url(#t3)" textLength="662.4" lengthAdjust="spacingAndGlyphs" class="mono" font-size="24" fill="#485265">4 AI systems shipped at Kleeto since May 2026.</text>
