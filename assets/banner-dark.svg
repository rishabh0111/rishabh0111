  <text x="96" y="236" clip-path="url(#t2)" textLength="532.8" lengthAdjust="spacingAndGlyphs" class="mono" font-size="24" fill="#D8DEE9">I design so the mistake can&#8217;t happen.</text>
  <text x="96" y="236" clip-path="url(#t3)" textLength="504.0" lengthAdjust="spacingAndGlyphs" class="mono" font-size="24" fill="#D8DEE9">I write about what breaks, and why.</text>
